[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locallecture"
version = "0.1.0"
description = "Local lecture notes with verifiable audio and slide evidence"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "numpy>=1.26,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
full = ["faster-whisper>=1.1,<2", "pymupdf4llm>=0.0.17,<1", "python-pptx>=1,<2", "sentence-transformers>=3,<6", "gradio>=5,<7", "pandas>=2,<4", "matplotlib>=3.8,<4"]

[project.scripts]
locallecture = "src.pipeline:main"
locallecture-ui = "app.gradio_app:main"

[tool.setuptools.packages.find]
include = ["src*", "app*"]
